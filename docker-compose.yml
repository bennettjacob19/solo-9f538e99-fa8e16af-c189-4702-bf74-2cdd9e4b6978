services:
  recovery-drill:
    build: .
    image: tape-recovery-drill:latest
    ports:
      - "8000:8000"
    environment:
      # 每读一个块的模拟延迟（秒），0 表示最快
      READ_DELAY: "0.05"
      TAPE_ROOT: /data/tapes
      OUTPUT_ROOT: /data/output
    volumes:
      - tape-data:/data/tapes
      - output-data:/data/output
    restart: unless-stopped

volumes:
  tape-data:
  output-data:
